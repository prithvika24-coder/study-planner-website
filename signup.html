{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Smart Study Planner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 45px 40px;
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);

            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .signup-card h1 {
            margin: 0;
            font-size: 30px;
            color: #222;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #777;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border: 1px solid #ddd;
            border-radius: 12px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .signup-btn {
            width: 100%;
            height: 52px;

            margin-top: 8px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .signup-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.35);
        }

        #signupMessage {
            margin: 15px 0 0;
            font-size: 14px;
        }

        .login-text {
            margin-top: 25px;

            font-size: 14px;
            color: #777;
        }

        .login-text a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;

            color: white;
            font-size: 14px;
            text-decoration: none;

            opacity: 0.9;
        }

        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .signup-card {
                padding: 35px 25px;
            }

            .signup-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-wrapper">

        <div class="signup-card">

            <div class="logo">
                📚
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Start organizing your study journey
            </p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="signupUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="signupUsername"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="signup-btn">
                    Create Account
                </button>

            </form>

            <p id="signupMessage"></p>

            <p class="login-text">
                Already have an account?
                <a href="/login-page/">Login</a>
            </p>

        </div>

        <a href="/" class="back-home">
            ← Back to Study Planner
        </a>

    </div>


    <script>

        const signupForm =
            document.getElementById("signupForm");

        signupForm.addEventListener("submit", async function(e) {

            e.preventDefault();

            const username =
                document.getElementById("signupUsername").value;

            const email =
                document.getElementById("signupEmail").value;

            const password =
                document.getElementById("signupPassword").value;


            try {

                const response = await fetch("/api/signup/", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })

                });


                const data = await response.json();

                const message =
                    document.getElementById("signupMessage");


                if (response.ok) {

                    message.textContent =
                        "Account created successfully!";

                    message.style.color = "green";


                    setTimeout(() => {

                        window.location.href =
                            "/login-page/";

                    }, 1000);

                } else {

                    message.textContent =
                        data.error || "Signup failed";

                    message.style.color = "red";
                }

            } catch (error) {

                console.error(error);

                document.getElementById("signupMessage").textContent =
                    "Something went wrong. Please try again.";

                document.getElementById("signupMessage").style.color =
                    "red";
            }

        });

    </script>

</body>
</html>
